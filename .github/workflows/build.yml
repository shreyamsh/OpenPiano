name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore OpenPiano.sln -r win-x64
      - name: Build
        run: dotnet build OpenPiano.sln -c Release -p:Platform=x64 --no-restore
  # Store publishing (add once the app name is reserved in Partner Center):
  #   - uses: microsoft/setup-msstore-cli@v1
  #   - run: msstore package .\OpenPiano
  #   - run: msstore publish .\OpenPiano   # needs Partner Center API credentials stored as repo secrets
